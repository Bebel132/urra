<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style.css">
    <title>Prototipos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
        }

        main {
            padding: 200px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 {
            color: #fff;
            font-size: 2rem;
        }

        main button {
            background: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            margin: 1rem;
            margin-bottom: 5rem;
        }

        .cena {
            position: relative;
            width: min(100%, 685px);
            aspect-ratio: 685 / 1522;
            padding-bottom: 1rem;
        }

        .cena > img:first-child {
            display: block;
            width: 100%;
            object-fit: cover;
        }

        .cena .gato {
            position: absolute;
            height: auto;
        }

        #gato1 {
            left: 28%;
            top: 39%;
            width: 15%;
        }

        #gato2 {
            left: 57%;
            top: 48%;
            width: 16%;
        }

        #gato3 {
            left: 73%;
            top: 37%;
            width: 18%;
        }

        main > div:not(.cena) {
            max-width: 750px;
            width: 100%;
        }

        #final1, #final2 {
            display: none;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .coletado {
            position: absolute;
            display: none;
            width: 150px;
            animation: gelatine 0.5s infinite, fadeColetado 1s ease forwards;
        }

        @keyframes fadeColetado {
            0% { opacity: 0; }
            20%, 80% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes gelatine {
            from, to { transform: scale(1, 1); }
            25% { transform: scale(0.9, 1.1); }
            50% { transform: scale(1.1, 0.9); }
            75% { transform: scale(0.95, 1.05); }
        }
    </style>
</head>
<body>
    <button class="voltar" onclick="window.location.href='../../index.html'">Voltar</button>
    <main>
        <div class="cena">
            <img src="imgs/1.png" alt="">
            <img src="imgs/2.1.png" id="final1" alt="">
            <img src="imgs/2.2.png" id="final2" alt="">
            <img src="imgs/gato1.png" class="gato" id="gato1" alt="">
            <img src="imgs/gato2.png" class="gato" id="gato2" alt="">
            <img src="imgs/gato3.png" class="gato" id="gato3" alt="">
        </div>
    </main>
    <img src="imgs/coletado.png" class="coletado" alt="">
    <script>
    const gatos = document.querySelectorAll(".gato");
    const inventario = [];
    let executado = false;

    gatos.forEach((gato) => {
        gato.addEventListener("click", () => {
            if (!executado) {
                const posicao = gato.getBoundingClientRect();
                gato.style.display = "none";
                inventario.push(gato);

                const coletado = document.createElement("img");
                coletado.classList.add("coletado");
                coletado.src = "imgs/coletado.png";
                document.body.appendChild(coletado);

                coletado.style.display = "block";
                coletado.style.left = `${(posicao.left + window.scrollX)-30}px`;
                coletado.style.top = `${posicao.top + window.scrollY}px`;
                
                setTimeout(() => {
                    coletado.style.display = "none";
                }, 1000);
            }
        });
    });


    window.addEventListener("scroll", () => {
        let chegouAoFinal = null

        if (window.innerWidth > 768) {
            chegouAoFinal = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight-400;
        } else {
            chegouAoFinal = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight-100;
        }

        if (chegouAoFinal && !executado) {
            executado = true;
            
            if (inventario.length === 3) {
                final2.style.display = "block";
            } else {
                final1.style.display = "block";
            }
        }
    });
</script>
</body>
</html>
