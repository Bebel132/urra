<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style.css">
    <title>Prototipos</title>
    <style>
        .a2doMal {
            display: none;
        }

        div:last-child {
            max-width: 400px;
        }

        #aviso {
            position: fixed;
            left: 50%;
            width: 300px;
            margin-left: -150px;
            bottom: 0;
            z-index: 9999;
            animation: shake 2s ease infinite, fadeAviso 1s ease forwards;
        }

        @keyframes fadeAviso {
            0% {
                opacity: 0;
            }

            20%,
            80% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-10px);
            }

            20%,
            40%,
            60%,
            80% {
                transform: translateX(10px);
            }
        }
    </style>
</head>

<body>
    <button class="voltar" onclick="window.location.href='../../index.html'">Voltar</button>
    <main>
        <div class="a1">
            <img src="imgs/1.jpeg" alt="">
        </div>
        <div class="a2">
            <img src="imgs/2.png" alt="">
        </div>
        <div class="a2doMal">
            <img src="imgs/2 do mal.png" alt="">
        </div>
        <div class="3">
            <img src="imgs/3.png" alt="">
        </div>
        <div class="4">
            <img src="imgs/4.png" alt="">
        </div>
    </main>
    <script>
        const musicaFinal = new Audio('../../musga/minecraft-train-whistle-cave-sound.mp3');
        musicaFinal.preload = 'auto';
        musicaFinal.volume = 0.7;
        musicaFinal.loop = false;
        let chegouAoFinal = false;
        let executado = false

        window.addEventListener("scroll", () => {
            if(!chegouAoFinal){
                chegouAoFinal = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight * 0.95;
            }

            if (chegouAoFinal && !executado) {
                executado = true

                document.querySelector(".a2").style.display = "none";
                document.querySelector(".a2doMal").style.display = "block";

                musicaFinal.currentTime = 0;
                musicaFinal.play().catch()

                const aviso = document.createElement("img");
                aviso.src = "imgs/aviso.png";
                aviso.id = "aviso";
                document.body.appendChild(aviso);

                setTimeout(() => {
                    aviso.style.display = "none";
                }, 1000);
            }
        });
    </script>
</body>

</html>
