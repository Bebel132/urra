<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Prototipos</title>
    <style>
        .a2doMal {
            display: none;
        }
        
        div:last-child {
            max-width: 400px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Protótipos</h1>
        <div>
            <button class="prev" disabled>anterior</button>
            <button class="next" onClick="window.location.href='/pages/02.html'">próximo</button>
        </div>
        <div class="a1">
            <img src="imgs/01/1.jpeg" alt="">
        </div>
        <div class="a2">
            <img src="imgs/01/2.png" alt="">
        </div>
        <div class="a2doMal">
            <img src="imgs/01/2 do mal.png" alt="">
        </div>
        <div class="3">
            <img src="imgs/01/3.png" alt="">
        </div>
        <div class="4">
            <img src="imgs/01/4.png" alt="">
        </div>
    </main>
    <script>
        let executado = false;

        window.addEventListener("scroll", () => {
            const chegouAoFinal =
                window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 400;

            if (chegouAoFinal && !executado) {
                executado = true;

                document.querySelector(".a2").style.display = "none";
                document.querySelector(".a2doMal").style.display = "block";
            }
        });
    </script>
</body>
</html>
