<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Anhangua</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=menu" />
        <link rel="stylesheet" href="Projeto/style.css" />
    </head>
    <body>
        <div id="overlay-inicio">
            <div class="overlay-conteudo">
                <h1>Anhangua</h1>
                <p>Esta apresentação contém sons.</p>
                <button id="btn-iniciar">Clique para iniciar a apresentação</button>
            </div>
        </div>

        <div class="cena" id="cena1">
            <img class="fundo bloqueado" src="Projeto/img/Cena1/cena1_incompleta.png" alt="">
            <!-- items -->
            <img class="elemento coletavel" src="Projeto/img/Cena1/bolsa.png" id="Lanterna"  alt="">
            <img class="elemento coletavel" src="Projeto/img/Cena1/gasolina.png" id="Gas" alt="">
            <img class="elemento coletavel" src="Projeto/img/Cena1/mapa.png" id="Mapa" alt="">
            <img class="fundo desbloqueado" src="Projeto/img/Cena1/cena1_completa.png" alt="">
        </div>

        <div class="cena" id="cena2">
            <img class="fundo padrao" src="Projeto/img/Cena2/cena2_sem_bixo.png" alt="">
            <img class="fundo terror" src="Projeto/img/Cena2/cena2_com_bixo.png" alt="">
        </div>

        <div class="cena" id="cena3">
            <img class="fundo padrao" src="Projeto/img/Cena3/temp_cena3_sem_sangue.png" alt="">
            <img class="padrao" src="Projeto/img/Cena3/tropeco.png" alt="" id="tropeco">
            <img class="padrao" src="Projeto/img/Cena3/chocalha.png" alt="" id="chocalha">
            <img class="padrao" src="Projeto/img/Cena3/batida.png" alt="" id="batida">
            <img class="fundo terror" src="Projeto/img/Cena3/temp_cena3_com_sangue.png" alt="">
        </div>

        <button id="botao-menu">
            <span class="material-symbols-outlined">
                    menu
            </span>
        </button>
        <button id="botao-prototipos" class="buttonLocked">ver protótipos</button>

        <script src="Projeto/script.js"></script>
    </body>
</html>
